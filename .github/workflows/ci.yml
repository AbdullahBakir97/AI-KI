name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install nbformat
        run: |
          python -m pip install --upgrade pip
          pip install nbformat
      - name: Validate every notebook
        continue-on-error: true
        run: |
          set +e
          status=0
          while IFS= read -r nb; do
            python -c "import nbformat; nbformat.validate(nbformat.read('$nb', as_version=4))"               && echo "ok   $nb"               || { echo "FAIL $nb"; status=1; }
          done < <(find . -type f -name '*.ipynb' -not -path './.git/*')
          exit $status
      - name: Smoke-import any Python modules in repo
        continue-on-error: true
        run: |
          if ls **/*.py 1> /dev/null 2>&1; then
            pip install ruff || true
            ruff check --select E9,F63,F7,F82 . || true
          else
            echo "no .py files to lint"
          fi
